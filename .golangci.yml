version: "2"

linters:
  default: none
  enable:
    - funlen
    - gocognit
    - errcheck
    - errorlint
    - unused
    - govet
    - staticcheck
    - ineffassign
  settings:
    funlen:
      lines: 70
      statements: -1
      ignore-comments: true
    gocognit:
      min-complexity: 30
  exclusions:
    rules:
      # Tests are exempt from the length and complexity limits: a table-driven
      # test reads best as one long function. Every other linter applies.
      - path: '_test\.go$'
        linters: [funlen, gocognit]
      # One rule per package not yet cleaned; every linter is excluded for that
      # path. A change that cleans a package deletes its rule.
      - path: '^cmd/relevo/'
        text: '.*'
      - path: '^internal/e2e/'
        text: '.*'
      - path: '^internal/pick/'
        text: '.*'
      - path: '^internal/remote/[^/]+\.go$'
        text: '.*'
      - path: '^internal/roles/'
        text: '.*'
      - path: '^internal/setup/'
        text: '.*'
      - path: '^internal/ui/[^/]+\.go$'
        text: '.*'
      - path: '^internal/ui/dash/'
        text: '.*'

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  tests: true
