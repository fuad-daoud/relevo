<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>relevo board</title>
<style>
:root {
  color-scheme: light dark;
  --relevo-accent: #2a6fb5;
  --relevo-surface: Canvas;
  --relevo-edge: rgba(128, 128, 128, 0.45);
  --relevo-shadow: rgba(0, 0, 0, 0.3);
}
@media (prefers-color-scheme: dark) {
  :root { --relevo-accent: #6fb0f0; --relevo-shadow: rgba(0, 0, 0, 0.6); }
}
body {
  margin: 0;
  font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
#bar { display: flex; gap: 8px; align-items: center; padding: 6px 12px; }
#banner {
  display: none;
  padding: 8px 12px;
  background: #8a5a00;
  color: #fff;
  word-break: break-all;
}
#banner.on { display: block; }
#status { padding: 8px 12px; color: #666; }

/* The canvas is the whole page, in comment mode as much as out of it. Nothing
   below narrows #frame, so opening or closing a panel cannot move the board out
   from under the pointer -- that is the whole reason the panes float. */
#frame { display: block; width: 100%; height: calc(100vh - 4rem); border: 0; }

/* All-comments panel: a floating pane over the canvas, not a dock beside it.
   It is as tall as its content and no taller -- a short list must not leave a
   column of empty panel hanging over the board. Past the cap the list scrolls
   inside the pane and the pane itself stops growing. */
#comments {
  display: none;
  position: fixed;
  z-index: 20;
  top: 3.4rem;
  right: 12px;
  width: 20rem;
  max-width: calc(100vw - 24px);
  max-height: calc(100vh - 4rem);
  overflow-y: auto;
  padding: 10px 12px;
  background: var(--relevo-surface);
  border: 1px solid var(--relevo-edge);
  border-radius: 10px;
  box-shadow: 0 10px 30px var(--relevo-shadow);
  box-sizing: border-box;
}
#comments.open { display: block; }

#comment-panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 6px;
}
#comment-panel-title { font-size: 11px; text-transform: uppercase; color: #666; }
#comments-close, #thread-close, #comment-dialog-close, .relevo-card-actions button {
  border: 1px solid var(--relevo-edge);
  border-radius: 6px;
  background: transparent;
  color: inherit;
  font: inherit;
  line-height: 1;
  padding: 2px 7px;
  cursor: pointer;
}
#comments-close:hover, #thread-close:hover,
#comment-dialog-close:hover, .relevo-card-actions button:hover { border-color: var(--relevo-accent); }

/* One thread card at a time, anchored beside the pin it belongs to. It is wide
   and wraps: the boxes carry no resize handles, so width is where a long
   comment gets room rather than a corner the reader has to find. */
#thread-card {
  display: none;
  position: fixed;
  z-index: 21;
  width: 24rem;
  max-width: calc(100vw - 16px);
  overflow-wrap: anywhere;
  padding: 8px 10px;
  background: var(--relevo-surface);
  border: 1px solid var(--relevo-edge);
  border-left: 3px solid var(--relevo-accent);
  border-radius: 8px;
  box-shadow: 0 8px 24px var(--relevo-shadow);
  box-sizing: border-box;
}
#thread-card.open { display: block; }
#thread-card .relevo-text { margin: 2px 0 4px; }

/* The card is a column: the thread's entries stacked, the box answering them
   under them, and the controls in one row beneath that. A control floated beside
   the box is what let the textarea cover Reply and the close. */
.relevo-card-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

/* What a fresh pick opens. It floats like the card rather than docking, so
   opening it cannot move the board out from under the pointer, and the panel
   behind it stays read-only while a note is being written. */
#comment-dialog {
  display: none;
  position: fixed;
  z-index: 22;
  top: 3.4rem;
  left: 12px;
  width: 24rem;
  max-width: calc(100vw - 24px);
  overflow-wrap: anywhere;
  padding: 8px 10px;
  background: var(--relevo-surface);
  border: 1px solid var(--relevo-edge);
  border-radius: 8px;
  box-shadow: 0 8px 24px var(--relevo-shadow);
  box-sizing: border-box;
}
#comment-dialog.open { display: block; }
#comment-dialog-head, #comment-dialog-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
#comment-dialog-title { font-size: 11px; text-transform: uppercase; color: #666; }
#comment-dialog-actions { justify-content: flex-end; }

/* What the composer is about, and what a thread card heads itself with: the name the
   frame derived for the element. A reader is never shown the CSS path, which is why
   this is the body font and not the selector's monospace. */
#comment-selector, .relevo-anchor {
  font-size: 12px;
  color: #666;
  overflow-wrap: anywhere;
}
.relevo-anchor {
  font-weight: 600;
  color: inherit;
  padding-bottom: 3px;
  margin-bottom: 3px;
  border-bottom: 1px solid var(--relevo-edge);
}

#comment-toggle {
  padding: 4px 10px;
  border: 1px solid rgba(128, 128, 128, 0.6);
  border-radius: 6px;
  background: transparent;
  color: inherit;
  font: inherit;
  cursor: pointer;
}
#comment-toggle.on { background: var(--relevo-accent); border-color: var(--relevo-accent); color: #fff; }
#banner-apply { margin-left: 8px; padding: 2px 8px; cursor: pointer; }
#comment-draft, #thread-reply {
  display: block;
  width: 100%;
  box-sizing: border-box;
  min-height: 5rem;
  font: inherit;
  margin: 6px 0;
  /* No corner to drag: the boxes wrap on a fixed width instead, so a comment
     never has to be resized before it can be read whole. */
  resize: none;
}
.relevo-hint {
  display: block;
  font-size: 11px;
  color: #666;
}
#comment-list h3 { margin: 10px 0 4px; font-size: 11px; text-transform: uppercase; color: #666; }
.relevo-row {
  display: block;
  width: 100%;
  text-align: left;
  margin: 0 0 4px;
  padding: 6px 8px;
  border: 1px solid rgba(128, 128, 128, 0.3);
  border-radius: 6px;
  background: transparent;
  color: inherit;
  font: inherit;
  cursor: pointer;
}
.relevo-row.focused { border-color: var(--relevo-accent); }
.relevo-row.orphan { opacity: 0.75; }
.relevo-by { display: block; font-size: 11px; color: #666; }
.relevo-text { display: block; }
.relevo-orphan-mark { display: block; font-size: 11px; color: #8a5a00; }
.relevo-empty, .relevo-error { color: #666; }
.relevo-error { color: #a33; }
</style>
</head>
<body>
<div id="bar">
  <button id="comment-toggle" type="button" aria-pressed="false" aria-controls="comments">Comment</button>
  <button id="banner-apply" type="button" style="display:none">Apply</button>
</div>
<div id="banner"></div>
<div id="status">loading board&hellip;</div>
<aside id="comments" aria-label="comments">
  <div id="comment-panel-head">
    <span id="comment-panel-title">all comments</span>
    <button id="comments-close" type="button" aria-label="close comments">&times;</button>
  </div>
  <div id="comment-list"></div>
</aside>
<section id="comment-dialog" aria-label="new comment">
  <div id="comment-dialog-head">
    <span id="comment-dialog-title">new comment</span>
    <button id="comment-dialog-close" type="button" aria-label="cancel this comment">&times;</button>
  </div>
  <div id="comment-selector"></div>
  <textarea id="comment-draft" placeholder="say something about this element"></textarea>
  <div id="comment-dialog-actions">
    <span class="relevo-hint">Ctrl+Enter to post</span>
  </div>
</section>
<section id="thread-card" aria-label="comment thread"></section>
<script src="shell.js"></script>
<script src="commentlist.js"></script>
<script src="comments.js"></script>
</body>
</html>
