name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: make check
        run: make check

      - name: check plugin manifest versions
        run: scripts/check-plugin-version.sh "${{ github.ref_name }}"

      # Only the platforms relevo actually supports. The build is CGO_ENABLED=0
      # and purego loads the embedded Turso library at run time, so plain
      # cross-compilation is enough -- no build matrix, no third-party release
      # tooling; the shipped binary is dynamically linked to that library.
      - name: build release archives
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            goos="${target%/*}"; goarch="${target#*/}"
            echo "==> $goos/$goarch"
            GOOS="$goos" GOARCH="$goarch" go build \
              -ldflags "-s -w -X main.version=${version} -X main.distribution=release" \
              -o "dist/relevo" ./cmd/relevo
            tar -czf "dist/relevo_${version}_${goos}_${goarch}.tar.gz" \
              -C dist relevo \
              -C .. README.md LICENSE
            rm dist/relevo
          done
          (cd dist && sha256sum relevo_*.tar.gz > checksums.txt)
          ls -l dist

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/relevo_*.tar.gz dist/checksums.txt

      # The plugin directory publishes every commit on plugin-release, so the
      # branch moves only after the release and its archives are out.
      - name: move plugin-release to the tagged commit
        run: scripts/promote-plugin-release.sh "${{ github.ref_name }}"
