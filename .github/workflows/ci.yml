name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a PR supersedes its running CI; main is never cancelled,
# so every commit that lands on main gets a complete run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The static checks run once, on ubuntu with go stable, instead of on every
  # os x go leg: gofmt, vet, the linter, the mod-tidy guard and the shell
  # lints. The test legs keep go test's own vet subset.
  lint:
    name: lint
    runs-on: ubuntu-latest
    env:
      GOLANGCI_LINT_VERSION: 2.14.0
      # Outside the checkout (runner.temp is not available in job-level env),
      # so gofmt, git ls-files and check-name never see the cache.
      GOLANGCI_LINT_CACHE: ${{ github.workspace }}/../golangci-lint-cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: install shellcheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y shellcheck
          fi

      # The linter is installed only on the leg that must run it, and only that
      # leg requires it (RELEVO_REQUIRE_LINT). CI has no network at test time,
      # so the install is a setup step, not something make check fetches. The
      # prebuilt release archive replaces `go install`, which compiled about 100
      # modules from source on every run.
      - name: install golangci-lint
        run: |
          url="https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_LINT_VERSION}"
          curl -sSfLO "$url/golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64.tar.gz"
          curl -sSfLO "$url/golangci-lint-${GOLANGCI_LINT_VERSION}-checksums.txt"
          sha256sum --check --ignore-missing "golangci-lint-${GOLANGCI_LINT_VERSION}-checksums.txt"
          tar -xzf "golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64.tar.gz"
          mkdir -p "$(go env GOPATH)/bin"
          install -m755 "golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64/golangci-lint" "$(go env GOPATH)/bin/golangci-lint"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # The linter's analysis cache lives outside the checkout, so gofmt, git
      # ls-files and check-name never see it. The key ends in the commit sha so
      # every run saves a fresh entry; the restore-keys fall back to the newest
      # entry for the same linter version and module/config hashes.
      - name: cache golangci-lint
        uses: actions/cache@v4
        with:
          path: ${{ env.GOLANGCI_LINT_CACHE }}
          key: golangci-lint-${{ env.GOLANGCI_LINT_VERSION }}-${{ hashFiles('go.sum', '.golangci.yml') }}-${{ github.sha }}
          restore-keys: |
            golangci-lint-${{ env.GOLANGCI_LINT_VERSION }}-${{ hashFiles('go.sum', '.golangci.yml') }}-
            golangci-lint-${{ env.GOLANGCI_LINT_VERSION }}-

      - name: make check-static
        env:
          RELEVO_REQUIRE_LINT: '1'
        run: make check-static

      # The darwin cross-vet replaces the vet the macOS legs used to run.
      - name: vet for darwin
        run: CGO_ENABLED=0 GOOS=darwin go vet ./...

  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }}, ${{ matrix.shard }}/3)
    runs-on: ${{ matrix.os }}
    env:
      # Go < 1.24 does not emit an LC_UUID load command on darwin unless
      # told to, and the current macOS dyld refuses to load a binary
      # without one -- the race-test binary of any package that imports
      # net dies with "dyld: missing LC_UUID load command" before its
      # tests start. -B gobuildid is the opt-in the 1.22/1.23 backports
      # added (golang/go#68678); on 1.24+ it is already the default.
      GOFLAGS: -ldflags=-B=gobuildid
    strategy:
      fail-fast: false
      matrix:
        # ubuntu and macos are the supported platforms; 1.25 is the floor
        # declared in go.mod, and stable catches anything the newest toolchain
        # starts complaining about.
        os: [ubuntu-latest]
        go: ['1.25', 'stable']
        # Each leg runs 3 shards of a weighted assignment (test-shard.sh places
        # the whole packages longest-first onto the least loaded shard, and
        # internal/relevo's tests round-robin across the shards), which is what
        # fits the race run in the job's wall time. Splitting more packages by
        # name costs more than it saves: every split is another race binary to
        # build and run on the same 3-4 cores.
        shard: [0, 1, 2]
        # PRs skip the 1.25 floor here as well as on test-macos, so a PR runs
        # the ubuntu legs on stable only and the race runs start together;
        # main still runs the full matrix on both platforms.
        exclude:
          - go: ${{ github.event_name == 'pull_request' && '1.25' || 'none' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: test shard
        run: sh scripts/test-shard.sh ${{ matrix.shard }} 3 .shard

      # Shellcheck and the scripts' own tests stay on every os x go leg, run by
      # shard 0, so the BSD userland on macOS keeps exercising them.
      - name: install shellcheck
        if: matrix.shard == 0
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install shellcheck
          else
            sudo apt-get update && sudo apt-get install -y shellcheck
          fi

      - name: check scripts
        if: matrix.shard == 0
        run: make check-scripts

      # Only the ubuntu/stable leg uploads, so the coverage job's `shard-*`
      # download matches exactly these 3 artifacts. The default `if` uploads a
      # passing shard only, so a red shard never feeds the coverage guard.
      - name: upload shard coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go == 'stable'
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: .shard/
          # upload-artifact skips dot-paths unless told otherwise.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # macOS is its own job so the coverage job, which only reads ubuntu/stable
  # shards, never waits behind the free plan's 5-job macOS queue.
  test-macos:
    name: test (${{ matrix.os }}, go ${{ matrix.go }}, ${{ matrix.shard }}/${{ github.event_name == 'pull_request' && 4 || 3 }})
    runs-on: ${{ matrix.os }}
    env:
      SHARDS: ${{ github.event_name == 'pull_request' && 4 || 3 }}
      # Go < 1.24 does not emit an LC_UUID load command on darwin unless
      # told to, and the current macOS dyld refuses to load a binary
      # without one -- the race-test binary of any package that imports
      # net dies with "dyld: missing LC_UUID load command" before its
      # tests start. -B gobuildid is the opt-in the 1.22/1.23 backports
      # added (golang/go#68678); on 1.24+ it is already the default.
      GOFLAGS: -ldflags=-B=gobuildid
    strategy:
      fail-fast: false
      matrix:
        # ubuntu and macos are the supported platforms; 1.25 is the floor
        # declared in go.mod, and stable catches anything the newest toolchain
        # starts complaining about.
        os: [macos-latest]
        go: ['1.25', 'stable']
        # A PR runs 4 shards on the stable leg alone, 4 macOS jobs under the
        # free plan's cap of 5; main runs 3 on each leg.
        # Each leg runs its shards as a weighted assignment (test-shard.sh places
        # the whole packages longest-first onto the least loaded shard, and
        # internal/relevo's tests round-robin across the shards), which is what
        # fits the race run in the job's wall time. Splitting more packages by
        # name costs more than it saves: every split is another race binary to
        # build and run on the same 3-4 cores.
        # On main the two macOS legs make 6 macOS jobs, one over the free plan's
        # cap of 5 concurrent macOS jobs, so one of them queues. Main is never
        # cancelled, so queueing only costs time.
        shard: [0, 1, 2, 3]
        # PRs skip macOS on the 1.25 floor to stay under the free plan's
        # 5-concurrent-macOS-job cap; main still runs the full matrix.
        exclude:
          - go: ${{ github.event_name == 'pull_request' && '1.25' || 'none' }}
          - shard: ${{ github.event_name == 'pull_request' && 'none' || 3 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: test shard
        # darwin's coverage report intermittently fails after a passing run, and only the ubuntu/stable shards feed the coverage job.
        env:
          SHARD_COVER: '0'
        run: sh scripts/test-shard.sh ${{ matrix.shard }} "$SHARDS" .shard

      # Shellcheck and the scripts' own tests stay on every os x go leg, run by
      # shard 0, so the BSD userland on macOS keeps exercising them.
      - name: install shellcheck
        if: matrix.shard == 0
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install shellcheck
          else
            sudo apt-get update && sudo apt-get install -y shellcheck
          fi

      - name: check scripts
        if: matrix.shard == 0
        run: make check-scripts

  # Merges the shards' coverage and runs the unchanged baseline guard on it.
  # `needs` includes test, so a red test is never reported as a coverage
  # verdict, and a missing artifact download makes cover-merge.sh exit 1 rather
  # than let the guard pass vacuously.
  coverage:
    name: coverage
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A PR's checkout is its merge commit, whose first parent is the
          # base it merges into.
          fetch-depth: 2

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # On a PR only the packages whose own files changed fail on a drop: some
      # packages measure a point or two apart run to run, and a PR that never
      # touched one must not go red on it. A push to main holds every package.
      # This runs before the artifacts land, which would count as changed
      # files, and writes outside the tree for the same reason.
      - name: coverage scope
        if: github.event_name == 'pull_request'
        run: |
          sh scripts/affected-packages.sh --direct --base HEAD^1 > "$RUNNER_TEMP/coverage-scope.txt"
          echo "COVERAGE_SCOPE=$RUNNER_TEMP/coverage-scope.txt" >> "$GITHUB_ENV"
          cat "$RUNNER_TEMP/coverage-scope.txt"

      # pattern matches only the ubuntu/stable leg's artifacts, the only leg
      # that uploads. Its go-version: stable resolves to the same Go as this
      # job's, so check-coverage.sh's baseline header comparison holds.
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards

      - name: merge coverage
        run: sh scripts/cover-merge.sh shards > .coverage.txt

      - name: show merged coverage
        run: cat .coverage.txt

      - name: check coverage
        env:
          RELEVO_REQUIRE_COVERAGE: '1'
        run: sh scripts/check-coverage.sh

  # The transparency proof: the same internal/db and internal/store suites with
  # every database reached through an in-process owner. The shards above run the
  # default direct mode, so every PR exercises both. It is deliberately not a
  # macOS leg: the free-plan macOS job cap, and this switch's owner-per-path fd
  # cost, while the short-socket-path rule is pinned by a test that runs
  # everywhere. It uploads no artifact, so the coverage job is unaffected.
  owner-mode:
    name: owner-mode
    runs-on: ubuntu-latest
    env:
      RELEVO_DBTEST_OWNER: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: test through an in-process owner
        run: go test -race -count=1 ./internal/db/... ./internal/store/...

  # The way back: the same internal/db and internal/store suites under the
  # modernc engine. The default binary links modernc too, for the one-time
  # conversion, so this leg is what keeps -tags modernc from rotting.
  # On a pull request this leg only keeps -tags modernc compiling and passing;
  # main adds the race detector on top, which roughly doubles its wall time.
  modernc:
    name: modernc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: vet under modernc
        run: go vet -tags modernc ./internal/db/...

      - name: test under modernc
        run: |
          race=
          if [ "${{ github.event_name }}" = push ]; then
            race=-race
          fi
          go test $race -count=1 -tags modernc ./internal/db/... ./internal/store/...

  portability:
    name: cross-compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      # One target per job, so the five builds run in parallel instead of
      # serially: what was ~230 s in a single job is now ~60-90 s, which stops
      # cross-compile from being the longest path once the test legs shrink.
      fail-fast: false
      matrix:
        # relevo is supported on Linux and macOS only, but the tree must keep
        # compiling elsewhere: this is what catches a platform-specific syscall
        # sneaking back in outside a build-tagged file.
        target:
          - linux/amd64
          - linux/arm64
          - darwin/amd64
          - darwin/arm64
          - windows/amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # CGO_ENABLED=0 because purego loads the embedded Turso library without a
      # C toolchain: without it a same-GOOS cross-compile (linux/arm64 from
      # linux/amd64) keeps cgo on and reaches for the host's gcc, which cannot
      # target arm64. The default binary is dynamically linked at run time, but
      # that linkage is purego's own dlopen, not cgo.
      - name: build for ${{ matrix.target }}
        env:
          CGO_ENABLED: '0'
          TARGET: ${{ matrix.target }}
        run: |
          GOOS=${TARGET%/*} GOARCH=${TARGET#*/} go build ./...
          GOOS=${TARGET%/*} GOARCH=${TARGET#*/} go build -tags modernc ./...

  # The one check the main branch ruleset requires. A required check that is
  # skipped counts as passed, and a skipped matrix job reports under its
  # unexpanded name, so naming the jobs themselves would let a failing test
  # through (coverage is skipped when test fails). This job always runs and
  # fails when any job failed or was cancelled.
  ci-ok:
    name: ci-ok
    needs: [lint, test, test-macos, coverage, owner-mode, modernc, portability]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every job passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if printf '%s' "$RESULTS" | grep -qE '"(failure|cancelled)"'; then
            exit 1
          fi
